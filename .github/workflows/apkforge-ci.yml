# APKForge CI (Phase 1: full tests + frontend build + compose check).
name: apkforge-ci
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "workers/**"
      - "plugins/**"
      - "frontend/**"
      - "cli/**"
      - "scripts/**"
      - "infra/**"
      - "docs/**"
      - ".github/workflows/apkforge-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "workers/**"
      - "plugins/**"
      - "frontend/**"
      - "cli/**"
      - "scripts/**"
      - "infra/**"
      - "docs/**"
env:
  APKFORGE_KEY: ci-test-key-0123456789abcdefghij-XYZ!
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-test.txt
      - run: pytest backend workers cli scripts -q
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
  # Phase 2: image build + sign (cosign) + SBOM attest (TODO).
