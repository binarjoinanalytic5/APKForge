# Apktool plugin: decode (apk -> tree) and rebuild (tree -> apk).
name: apktool
version: 1.0.0
sdk_version: 1.0.0
description: Wraps Apktool decode/rebuild behind the Plugin SDK v1 protocol.
license: Apache-2.0
tool:
  name: apktool
  version: 3.0.2
runtime:
  command: ["python3", "run.py"]
  timeout_s: 600
  memory_mb: 2048
  cpu: 2.0
  network: none
inputs:
  type: object
outputs:
  type: object
capabilities: ["decompile", "rebuild"]
