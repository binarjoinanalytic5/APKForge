openapi: 3.0.3
info:
  version: 1.0.0
  title: APKForge API
  description: >-
    العقد المجمد v1 (المرحلة 0). أي كسر يتطلب إصدارًا رئيسيًا ومسار هجرة.
    المصادقة: Bearer JWT. البث الحي موثق في websocket.md.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: projects
  - name: jobs
paths:
  /health:
    get:
      operationId: health
      tags: [jobs]
      summary: نبض الخدمة (مرحلة 0)
      responses:
        '200':
          description: سليم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: تسجيل الدخول
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: رمز الدخول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: إنشاء حساب
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: قائمة المشاريع
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: createProject
      tags: [projects]
      summary: إنشاء مشروع
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: تفاصيل مشروع
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: حذف مشروع (تأكيد صريح + تدقيق)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: حُذف
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/upload:
    post:
      operationId: uploadApk
      tags: [projects]
      summary: رفع APK (يُخزَّن + يُبصَم + يُنشَأ سجل)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: قُبِل للمعالجة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/decompile:
    post:
      operationId: startDecompile
      tags: [projects]
      summary: بدء فك التجميع (Apktool/JADX)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolSelect'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/analyze:
    post:
      operationId: startAnalyze
      tags: [projects]
      summary: بدء التحليل (Androguard/Quark/Semgrep)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolSelect'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/rebuild:
    post:
      operationId: startRebuild
      tags: [projects]
      summary: إعادة البناء (Apktool + محاذاة)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/sign:
    post:
      operationId: startSign
      tags: [projects]
      summary: التوقيع (apksigner + تحقق)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/download:
    get:
      operationId: downloadResult
      tags: [projects]
      summary: تنزيل النتيجة + التقرير
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: ملف النتيجة
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: حالة مهمة
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{job_id}/logs:
    get:
      operationId: getJobLogs
      tags: [jobs]
      summary: سجلات مهمة (اللقطة؛ الحي عبر WebSocket)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogs'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: طلب خاطئ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: غير مصرح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        api_version:
          type: string
          const: 1.0.0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: object
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
    Token:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Job:
      type: object
      required: [job_id, project_id, kind, status, created_at]
      properties:
        job_id:
          type: string
        project_id:
          type: string
        kind:
          type: string
          enum: [upload, decompile, analyze, rebuild, sign]
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobLogs:
      type: object
      required: [job_id, lines]
      properties:
        job_id:
          type: string
        lines:
          type: array
          items:
            type: string
    ToolSelect:
      type: object
      properties:
        tool:
          type: string
        options:
          type: object
    SignRequest:
      type: object
      properties:
        keystore_ref:
          type: string
          description: مرجع مخزن معرّف مسبقًا — لا تُقبَل مفاتيح خام في الطلب
        schemes:
          type: array
          items:
            type: string
            enum: [v1, v2, v3, v4]
x-frozen: true
x-contract-version: 1.0.0
