openapi: 3.0.3
info:
  version: 1.0.0
  title: APKForge API
  description: >-
    العقد المجمد v1 (المرحلة 0). أي كسر يتطلب إصدارًا رئيسيًا ومسار هجرة.
    المصادقة: Bearer JWT. البث الحي موثق في websocket.md.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: projects
  - name: jobs
paths:
  /health:
    get:
      operationId: health
      tags: [jobs]
      summary: نبض الخدمة (مرحلة 0)
      responses:
        '200':
          description: سليم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: تسجيل الدخول
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: رمز الدخول
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: إنشاء حساب
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: قائمة المشاريع
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: createProject
      tags: [projects]
      summary: إنشاء مشروع
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: تفاصيل مشروع
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: حذف مشروع (تأكيد صريح + تدقيق)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: حُذف
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/upload:
    post:
      operationId: uploadApk
      tags: [projects]
      summary: رفع APK (يُخزَّن + يُبصَم + يُنشَأ سجل)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: قُبِل للمعالجة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/decompile:
    post:
      operationId: startDecompile
      tags: [projects]
      summary: بدء فك التجميع (Apktool/JADX)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolSelect'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/analyze:
    post:
      operationId: startAnalyze
      tags: [projects]
      summary: بدء التحليل (Androguard/Quark/Semgrep)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolSelect'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/rebuild:
    post:
      operationId: startRebuild
      tags: [projects]
      summary: إعادة البناء (Apktool + محاذاة)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/sign:
    post:
      operationId: startSign
      tags: [projects]
      summary: التوقيع (apksigner + تحقق)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
      responses:
        '202':
          description: مهمة بدأت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{id}/download:
    get:
      operationId: downloadResult
      tags: [projects]
      summary: تنزيل النتيجة + التقرير
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: ملف النتيجة
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: حالة مهمة
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{job_id}/logs:
    get:
      operationId: getJobLogs
      tags: [jobs]
      summary: سجلات مهمة (اللقطة؛ الحي عبر WebSocket)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogs'
  /setup/status:
    get:
      operationId: setupStatus
      tags: [setup]
      summary: حالة التهيئة الأولى (عام — للإقلاع)
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
  /setup/admin:
    post:
      operationId: setupAdmin
      tags: [setup]
      summary: إنشاء المدير الأول (مرة واحدة فقط)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupAdminResponse'
        '403':
          description: النظام مهيأ مسبقًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /updates/current:
    get:
      operationId: updateCurrent
      tags: [updates]
      summary: نسخة المنصة الحالية والقناة (عام)
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCurrent'
  /updates/manifest:
    get:
      operationId: updateManifest
      tags: [updates]
      summary: بيان التحديث للقناة (ETag + 304)
      parameters:
        - name: channel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateManifest'
        '404':
          $ref: '#/components/responses/NotFound'
  /updates/check:
    post:
      operationId: updateCheck
      tags: [updates]
      summary: فحص حالة التحديث لعميل (عام)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: إشعارات المستخدم مع المقروئية
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /notifications/{id}/read:
    post:
      operationId: markNotification
      tags: [notifications]
      summary: تمييز مقروء/غير مقروء
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResult'
  /notifications/prefs:
    get:
      operationId: getNotificationPrefs
      tags: [notifications]
      summary: تفضيلات الإشعارات
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prefs'
    put:
      operationId: setNotificationPrefs
      tags: [notifications]
      summary: تحديث التفضيلات (الحرجة لا تُكتم)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefsIn'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prefs'
  /notifications/broadcast:
    post:
      operationId: broadcastNotification
      tags: [notifications]
      summary: بث إداري (مدير فقط)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: حذف إشعار (مدير فقط)
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: حُذف
  /admin/releases:
    post:
      operationId: createRelease
      tags: [admin]
      summary: إنشاء إصدار (مسودة)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreate'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
    get:
      operationId: listReleases
      tags: [admin]
      summary: قائمة الإصدارات
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
  /admin/updates/apply:
    post:
      summary: Trigger a detached local update run
      security: [{bearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '202':
          description: Update run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResult'
        '400': {description: Already updated, busy, or unknown release}
        '403': {description: Admin required}
  /admin/updates/local-status:
    get:
      summary: Latest local update run state
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Run state (IDLE when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalStatus'
        '403': {description: Admin required}
  /admin/releases/history:
    get:
      operationId: releaseHistory
      tags: [admin]
      summary: سجل الإصدارات المنشورة
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
  /admin/releases/{id}/validate:
    post:
      operationId: validateRelease
      tags: [admin]
      summary: اعتماد مسودة
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /admin/releases/{id}/publish:
    post:
      operationId: publishRelease
      tags: [admin]
      summary: نشر إصدار (مع بث إشعار)
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /admin/releases/{id}/unpublish:
    post:
      operationId: unpublishRelease
      tags: [admin]
      summary: سحب إصدار
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /admin/maintenance:
    get:
      operationId: getMaintenance
      tags: [admin]
      summary: حالة الصيانة
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
    put:
      operationId: setMaintenance
      tags: [admin]
      summary: تبديل الصيانة
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceIn'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
  /admin/channel:
    get:
      operationId: getChannel
      tags: [admin]
      summary: قناة التحديث
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
    put:
      operationId: setChannel
      tags: [admin]
      summary: تغيير القناة
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelIn'
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
  /admin/backups:
    get:
      operationId: listBackups
      tags: [admin]
      summary: النسخ الاحتياطية وأوامر الاسترجاع
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: حسنًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: طلب خاطئ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: غير مصرح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        api_version:
          type: string
          const: 1.0.0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: object
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
    Token:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Job:
      type: object
      required: [job_id, project_id, kind, status, created_at]
      properties:
        job_id:
          type: string
        project_id:
          type: string
        kind:
          type: string
          enum: [upload, decompile, analyze, rebuild, sign]
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobLogs:
      type: object
      required: [job_id, lines]
      properties:
        job_id:
          type: string
        lines:
          type: array
          items:
            type: string
    ToolSelect:
      type: object
      properties:
        tool:
          type: string
        options:
          type: object
    SignRequest:
      type: object
      properties:
        keystore_ref:
          type: string
          description: مرجع مخزن معرّف مسبقًا — لا تُقبَل مفاتيح خام في الطلب
        schemes:
          type: array
          items:
            type: string
            enum: [v1, v2, v3, v4]
    SetupStatus:
      type: object
      required: [initialized]
      properties:
        initialized:
          type: boolean
    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
        display_name:
          type: string
        email:
          type: string
    SetupAdminResponse:
      type: object
      required: [username, role, access_token, token_type]
      properties:
        username:
          type: string
        role:
          type: string
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
    UpdateCurrent:
      type: object
      required: [version, version_code, channel]
      properties:
        version:
          type: string
        version_code:
          type: integer
        channel:
          type: string
    UpdateManifest:
      type: object
      required: [latest_version, version_code, minimum_supported_version]
      properties:
        latest_version:
          type: string
        version_code:
          type: integer
        minimum_supported_version:
          type: string
        release_type:
          type: string
        channel:
          type: string
        mandatory:
          type: boolean
        security_update:
          type: boolean
        release_date:
          type: string
        artifact_kind:
          type: string
        download_url:
          type: string
        artifact_ref:
          type: string
        checksum:
          type: string
        signature:
          type: string
        size_bytes:
          type: integer
        release_notes:
          type: array
          items:
            type: string
        breaking_changes:
          type: array
          items:
            type: string
        migration_required:
          type: boolean
        restart_required:
          type: boolean
    CheckRequest:
      type: object
      required: [current_version]
      properties:
        current_version:
          type: string
        channel:
          type: string
    CheckResult:
      type: object
      required: [status, current_version, channel]
      properties:
        status:
          type: string
          enum: [NO_UPDATE, UPDATE_AVAILABLE, MANDATORY_UPDATE]
        current_version:
          type: string
        channel:
          type: string
        latest_version:
          type: string
        mandatory:
          type: boolean
        security_update:
          type: boolean
        release_notes:
          type: array
          items:
            type: string
        maintenance:
          $ref: '#/components/schemas/Maintenance'
    Notification:
      type: object
      required: [id, ntype, title, message, created_at]
      properties:
        id:
          type: string
        ntype:
          type: string
        severity:
          type: string
        priority:
          type: integer
        title:
          type: string
        message:
          type: string
        action:
          type: object
        target:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
        read:
          type: boolean
    NotificationList:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread:
          type: integer
    ReadRequest:
      type: object
      properties:
        read:
          type: boolean
    ReadResult:
      type: object
      required: [id, read]
      properties:
        id:
          type: string
        read:
          type: boolean
    Prefs:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
    PrefsIn:
      type: object
      required: [prefs]
      properties:
